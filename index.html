<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Supermercado Side Scroller (Android)</title>
    <style>
        /* --- CARGA DE LA FUENTE KOMIKAX DE TU CARPETA --- */
        @font-face {
            font-family: 'Komikax';
            src: url('./komikax_.ttf') format('truetype'),
                 url('./komikax.ttf') format('truetype'),
                 url('./komikax.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #333;
            color: white;
            font-family: Arial, sans-serif;
            touch-action: manipulation;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        #background {
            background-size: auto 100%;
            background-repeat: no-repeat;
            position: absolute;
            top: 0;
            left: 0;
            height: 100vh;
            z-index: 1;
        }

        /* --- ESTILOS DE LA BARRICADA --- */
        #barricade {
            position: absolute;
            bottom: 8.3vh;
            z-index: 5;
            display: none;
            transform: translate(20%, 30%);
        }

        #barricade img {
            height: 40vh;
            width: auto;
        }

        #foreground {
            background-size: auto 100%;
            background-repeat: no-repeat;
            position: absolute;
            top: 0;
            left: 0;
            height: 100vh;
            z-index: 10;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        #player {
            position: absolute;
            bottom: 8.3vh;
            left: 100px;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
        }

        #player-shadow {
            position: absolute;
            bottom: -1.5vh;
            left: 50%;
            transform: translateX(-50%);
            width: 18vh;
            height: auto;
            z-index: 1;
            pointer-events: none;
            opacity: 0.8;
            transition: opacity 0.1s, transform 0.1s;
        }

        #player img#player-img {
            height: 40vh;
            width: auto;
            display: block;
            position: relative;
            z-index: 2;
            filter: drop-shadow(0px 8px 6px rgba(0,0,0,0.4));
            transition: transform 0.1s ease;
        }

        #player.facing-left img#player-img { transform: scaleX(-1); }
        #player.facing-right img#player-img { transform: scaleX(1); }

        .zombie-container {
            position: absolute;
            bottom: 8.3vh;
            z-index: 2;
            pointer-events: none;
        }

        .zombie-shadow {
            position: absolute;
            bottom: -1.5vh;
            left: 50%;
            transform: translateX(-50%);
            width: 18vh;
            height: auto;
            z-index: 1;
            pointer-events: none;
            opacity: 0.8;
        }

        .zombie-container img.zombie-img {
            height: 40vh;
            width: auto;
            display: block;
            position: relative;
            z-index: 2;
            filter: drop-shadow(0px 8px 6px rgba(0,0,0,0.4));
        }

        .zombie-container.facing-left img.zombie-img { transform: scaleX(-1); }
        .zombie-container.facing-right img.zombie-img { transform: scaleX(1); }

        .rat-container {
            position: absolute;
            bottom: 8.3vh;
            z-index: 2;
            pointer-events: none;
        }

        .rat-shadow {
            position: absolute;
            bottom: -0.5vh;
            left: 50%;
            transform: translateX(-50%);
            width: 10vh;
            height: auto;
            z-index: 1;
            pointer-events: none;
            opacity: 0.8;
        }

        .rat-container img.rat-img {
            height: 12vh;
            width: auto;
            display: block;
            position: relative;
            z-index: 2;
            filter: drop-shadow(0px 4px 4px rgba(0,0,0,0.4));
        }

        .rat-container.facing-left img.rat-img { transform: none; }
        .rat-container.facing-right img.rat-img { transform: scaleX(-1); }

        .smoke-effect {
            position: absolute;
            bottom: 8.3vh;
            z-index: 3;
            pointer-events: none;
            height: 40vh;
            width: auto;
            transform: translateX(-50%);
        }

        .smoke-effect.facing-left { transform: translateX(-50%) scaleX(-1); }
        .smoke-effect.facing-right { transform: translateX(-50%) scaleX(1); }

        /* --- PANTALLA DE INICIO (NIVEL 0) --- */
        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('./nivel 0.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 5vh;
            z-index: 99999;
            cursor: pointer;
        }

        #level0-logo {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1.5);
            max-width: 95vw;
            max-height: 85vh;
            object-fit: contain;
            filter: drop-shadow(0px 8px 12px rgba(0,0,0,0.7));
            opacity: 0;
            animation: logo-fade-in 1.5s ease-out forwards;
            pointer-events: none;
        }

        @keyframes logo-fade-in {
            0% {
                opacity: 0;
                transform: translate(-50%, -55%) scale(1.35);
            }
            100% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.5);
            }
        }

        .start-message {
            position: relative;
            z-index: 10;
            font-family: 'Komikax', sans-serif;
            font-size: 8vh;
            font-weight: normal;
            color: #FF2222;
            text-transform: uppercase;
            letter-spacing: 0.3vh;
            animation: start-blink 0.8s infinite alternate;
            text-shadow: 0 0 2vh rgba(255, 34, 34, 0.9), 3px 3px 0 #000, -2px -2px 0 #000;
        }

        @keyframes start-blink {
            0% { opacity: 0.2; }
            100% { opacity: 1; }
        }

        /* --- INTERFAZ SUPERIOR (HUD) --- */
        #top-hud {
            position: fixed;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            pointer-events: none;
        }

        #health-section {
            display: flex;
            align-items: center;
            gap: 13px; 
        }

        #enzos-img {
            height: 94px !important; 
            min-height: 94px !important;
            max-height: 94px !important;
            width: auto !important;
            object-fit: contain;
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.6));
        }

        #health-details {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        #health-bar-container {
            width: 250px !important;
            height: 31px !important;
            background-color: rgba(0, 0, 0, 0.6);
            border: 3px solid #ffffff;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0px 4px 8px rgba(0,0,0,0.5);
        }

        #health-bar {
            width: 100%;
            height: 100%;
            background-color: #ff2222; 
            border-radius: 10px;
            transition: width 0.1s linear;
        }

        #lives-container {
            display: flex;
            gap: 6px;
            pointer-events: none;
        }

        .life-rect {
            width: 35px;
            height: 14px;
            background-color: #ff2222;
            border: 2px solid #ffffff;
            border-radius: 6px;
            box-shadow: 0px 2px 4px rgba(0,0,0,0.5);
            transition: background-color 0.2s, opacity 0.2s;
        }

        .life-rect.empty {
            background-color: rgba(0, 0, 0, 0.5);
            opacity: 0.5;
        }

        #level-indicator {
            position: fixed;
            top: 130px;
            left: 15px;
            padding: 6px 12px;
            background-color: rgba(0,0,0,0.7);
            border-radius: 5px;
            pointer-events: none;
            z-index: 100;
            font-weight: bold;
            font-size: 16px;
        }

        #score-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        #score-container img#agustines-img {
            height: 94px !important;
            min-height: 94px !important;
            max-height: 94px !important;
            width: auto !important;
            display: block;
            object-fit: contain;
            filter: drop-shadow(0px 5px 8px rgba(0, 0, 0, 0.6));
        }

        #score-container .score-text {
            font-family: 'Komikax', sans-serif;
            font-size: 43px !important;
            line-height: 1 !important;
            font-weight: normal;
            color: #ffffff;
            text-shadow: -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000, 3px 3px 0 #000;
        }

        /* --- MENSAJE INICIAL DEL NIVEL 1 --- */
        #level-objective-msg {
            position: fixed;
            top: 110px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3000;
            pointer-events: none;
            font-family: 'Komikax', sans-serif;
            font-size: clamp(14px, 3vw, 24px);
            white-space: nowrap;
            color: #FFD700;
            text-align: center;
            text-transform: uppercase;
            text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000;
            background: rgba(0, 0, 0, 0.75);
            padding: 8px 16px;
            border-radius: 12px;
            border: 2px solid rgba(255, 215, 0, 0.4);
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            max-width: 90vw;
        }

        #level-objective-msg.visible {
            opacity: 1;
        }

        /* --- CONTROLES TÁCTILES --- */
        #touch-controls {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            z-index: 1000;
            pointer-events: none;
        }

        .d-pad, .action-pad {
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }

        .touch-btn {
            width: 70px;
            height: 70px;
            background: rgba(0, 0, 0, 0.5);
            border: 3px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            color: white;
            font-weight: bold;
            touch-action: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: background 0.1s;
        }

        .touch-btn:active {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(0.95);
        }

        .btn-punch {
            background: rgba(220, 53, 69, 0.6);
        }

        #go-indicator {
            position: fixed;
            right: 5vw; 
            top: 50%;
            transform: translateY(-50%);
            display: none; 
            align-items: center;
            gap: 1.5vh; 
            z-index: 2000; 
            pointer-events: none;
        }

        #go-indicator .go-text {
            font-family: 'Komikax', sans-serif;
            font-size: 8vh; 
            font-weight: normal;
            color: #FFD700; 
            text-transform: uppercase;
            font-style: italic;
            letter-spacing: 0.3vh;
            text-shadow: 0 0 1.5vh rgba(255, 215, 0, 0.8), 0.3vh 0.3vh 0 #000, -0.1vh -0.1vh 0 #000;
            filter: drop-shadow(0px 0.5vh 0.8vh rgba(0,0,0,0.6));
            line-height: 1; 
        }

        #go-indicator .go-arrow {
            width: 0;
            height: 0;
            border-top: 4vh solid transparent;
            border-bottom: 4vh solid transparent;
            border-left: 6vh solid #FF1111; 
            filter: drop-shadow(0px 0.6vh 1vh rgba(255,0,0,0.6)) drop-shadow(0.2vh 0.2vh 0px #000);
        }

        @keyframes go-blink-infinite {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        .do-go-blink-infinite {
            display: flex !important;
            animation: go-blink-infinite 0.8s step-end infinite; 
        }

        /* --- PANTALLA DE GAME OVER --- */
        #gameover-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            background-image: url('./gameover.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease;
            overflow: hidden;
        }

        #gameover-screen.visible {
            opacity: 1;
            pointer-events: auto;
        }

        #gameover-text {
            position: relative;
            z-index: 2;
            font-family: 'Komikax', sans-serif;
            font-size: 10vh;
            color: #FF1111;
            text-transform: uppercase;
            pointer-events: none;
            text-align: center;
            animation: gameover-blink 1s ease-in-out infinite alternate;
        }

        @keyframes gameover-blink {
            0% {
                opacity: 0.2;
                text-shadow: 0 0 1vh rgba(255, 0, 0, 0.2), 4px 4px 0 #000, -3px -3px 0 #000;
            }
            100% {
                opacity: 1;
                text-shadow: 0 0 3vh rgba(255, 0, 0, 0.9), 4px 4px 0 #000, -3px -3px 0 #000;
            }
        }
    </style>
</head>
<body>

    <!-- PANTALLA DE INICIO NIVEL 0 -->
    <div id="start-screen">
        <img id="level0-logo" src="./nivel 0 logo.png" alt="Logo Nivel 0">
        <div class="start-message">START</div>
    </div>

    <!-- PANTALLA DE GAME OVER -->
    <div id="gameover-screen">
        <div id="gameover-text">GAME OVER</div>
    </div>

    <!-- MENSAJE DE OBJETIVO DEL NIVEL -->
    <div id="level-objective-msg">Mata 10 zombis y pasa de nivel</div>

    <div id="game-container">
        <div id="background"></div>
        <!-- BARRICADA DEL NIVEL 1 -->
        <div id="barricade"><img src="./barricada.png" alt="Barricada"></div>
        <div id="player" class="facing-right">
            <img id="player-shadow" src="./sombra.png" alt="Sombra">
            <img id="player-img" src="./reposo.gif" alt="Jugador">
        </div>
        <div id="foreground"></div>
    </div>

    <!-- HUD -->
    <div id="top-hud">
        <div id="health-section">
            <img id="enzos-img" src="./enzos.png" alt="Enzos">
            <div id="health-details">
                <div id="health-bar-container">
                    <div id="health-bar"></div>
                </div>
                <div id="lives-container">
                    <div class="life-rect" id="life-1"></div>
                    <div class="life-rect" id="life-2"></div>
                    <div class="life-rect" id="life-3"></div>
                </div>
            </div>
        </div>

        <div id="score-container">
            <img id="agustines-img" src="./agustines.png" alt="Agustines">
            <div class="score-text">x <span id="kill-count">0</span></div>
        </div>
    </div>

    <div id="level-indicator">Nivel 1</div>

    <!-- CONTENEDOR DE LA FLECHA GO -->
    <div id="go-indicator">
        <div class="go-text">GO</div>
        <div class="go-arrow"></div>
    </div>

    <!-- CONTROLES TÁCTILES -->
    <div id="touch-controls">
        <div class="d-pad">
            <div class="touch-btn" id="btn-left">◄</div>
            <div class="touch-btn" id="btn-right">►</div>
        </div>
        <div class="action-pad">
            <div class="touch-btn" id="btn-jump">▲</div>
            <div class="touch-btn btn-punch" id="btn-punch">🥊</div>
        </div>
    </div>

    <script>
        const container = document.getElementById('game-container');
        const background = document.getElementById('background');
        const foreground = document.getElementById('foreground');
        const player = document.getElementById('player');
        const playerImg = document.getElementById('player-img');
        const playerShadow = document.getElementById('player-shadow');
        const levelIndicator = document.getElementById('level-indicator');
        const killCountElement = document.getElementById('kill-count');
        const healthBar = document.getElementById('health-bar');
        const goIndicator = document.getElementById('go-indicator');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('gameover-screen');
        const barricadeElement = document.getElementById('barricade');
        const levelObjectiveMsg = document.getElementById('level-objective-msg');

        const IDLE_SRC = './reposo.gif';
        const WALK_SRC = './nino_anda.gif';
        const JUMP_SRC = './salto.gif';
        const SHADOW_SRC = './sombra.png';
        const PUNCH_SRC = './punch.gif'; 
        const ZOMBIE_SRC = './zombi_cojer.gif'; 
        const ZOMBIE_GRAB_SRC = './zombi_cojer.gif'; 
        const RAT_SRC = './rata1.gif';
        const SMOKE_SRC = './humo.gif';   
        const DEATH_SRC = './muertes.gif'; 
        
        const DEATH_ANIMATION_DURATION = 1200; 

        const LEVEL_BACKGROUNDS = {
            1: './Gemini_Generated_Image_3vva7f3vva7f3vva.png',
            2: './nivel 3.png',
            3: './nivel 2.png'
        };

        const LEVEL_FOREGROUNDS = {
            1: './foreground.png',
            2: './foreground 3.png',
            3: './nivel 2 foreground.png'
        };

        const PARALLAX_FACTORS = { 1: 0.75, 2: 1.3, 3: 1.0 };

        let currentLevel = 1;
        let isChangingLevel = false;
        let killedZombies = 0;

        let maxHealth = 100;
        let currentHealth = 100;
        let isDead = false;
        let deathAnimationStarted = false;
        let gameStarted = false; 
        let isGameOver = false;
        let gameOverTimeout = null;
        let objectiveTimeout = null;

        let maxLives = 3;
        let currentLives = 3;

        // Variables de la Barricada Dinámica
        let barricadeActive = true;
        const KILLS_REQUIRED = 10;

        function showObjectiveMessage() {
            if (!levelObjectiveMsg) return;
            if (objectiveTimeout) clearTimeout(objectiveTimeout);

            levelObjectiveMsg.classList.add('visible');
            objectiveTimeout = setTimeout(() => {
                levelObjectiveMsg.classList.remove('visible');
            }, 4000);
        }

        function updateLivesUI() {
            for (let i = 1; i <= maxLives; i++) {
                const lifeEl = document.getElementById(`life-${i}`);
                if (lifeEl) {
                    if (i <= currentLives) {
                        lifeEl.classList.remove('empty');
                    } else {
                        lifeEl.classList.add('empty');
                    }
                }
            }
        }

        let screenWidth = window.innerWidth;
        let screenHeight = window.innerHeight;

        function getPlayerWidth() {
            return screenHeight * 0.40 * 0.5;
        }

        function getPlayerSpeed() {
            return screenHeight * 0.3 * 1.2 * 1.1;
        }

        function getFloorHeightPx() {
            return screenHeight * 0.083;
        }

        let JUMP_FORCE = 0;
        let GRAVITY = 0;

        function updateJumpPhysics() {
            const maxJumpHeight = screenHeight * 0.28; 
            const timeToApex = 0.5 * 0.7 * 0.7 * 1.05 * 0.95;
            GRAVITY = (2 * maxJumpHeight) / (timeToApex * timeToApex);
            JUMP_FORCE = GRAVITY * timeToApex;
        }

        updateJumpPhysics();

        window.addEventListener('resize', () => {
            screenWidth = window.innerWidth;
            screenHeight = window.innerHeight;
            
            updateJumpPhysics();

            if (gameStarted) {
                const activeBg = new Image();
                activeBg.onload = function() {
                    backgroundWorldWidth = screenHeight * (this.width / this.height);
                    background.style.width = `${backgroundWorldWidth}px`;
                };
                activeBg.src = encodeURI(LEVEL_BACKGROUNDS[currentLevel]);
            }
        });

        let backgroundWorldWidth = 16384; 
        let foregroundWorldWidth = 16384;
        let playerWorldX = 100;
        let targetCamerax = 0;
        let keysPressed = {};
        let isMoving = false;
        let isPunching = false; 

        let playerY = 0;
        let jumpVelocity = 0;
        let isJumping = false;

        let zombies = [];
        let rats = [];
        let smokeEffects = [];

        let zombieSpawnTimeout = null;
        let zombieSpawnInterval = null;
        let ratSpawnInterval = null;

        const ZOMBIE_INITIAL_DELAY = 3000; 
        const ZOMBIE_SPAWN_RATE = 4500;    
        const RAT_SPAWN_RATE = 6000;

        playerImg.style.height = '40.8vh';

        let playerInactivityTime = 0;
        const GO_TRIGGER_SECONDS = 3;
        let isGoActive = false;

        function updateGoLogic(isMovingThisFrame, isJumpingThisFrame, dt) {
            if (!gameStarted || isGameOver) return;
            if (isMovingThisFrame || isJumpingThisFrame) {
                playerInactivityTime = 0; 

                if (isGoActive) {
                    goIndicator.classList.remove('do-go-blink-infinite');
                    isGoActive = false;
                }
                return;
            }

            if (!isDead && !isPunching && !isChangingLevel) {
                playerInactivityTime += dt;

                if (playerInactivityTime >= GO_TRIGGER_SECONDS && !isGoActive) {
                    isGoActive = true;
                    goIndicator.classList.add('do-go-blink-infinite');
                }
            } else {
                playerInactivityTime = 0;
            }
        }

        function setPlayerSprite(src, height) {
            playerImg.src = src;
            playerImg.style.height = height;
        }

        /* --- CONFIGURACIÓN DE MÚSICA DE FONDO --- */
        const BG_MUSIC = new Audio('./musica_fondo.mp3');
        BG_MUSIC.loop = true;
        BG_MUSIC.volume = 1.0; 
        BG_MUSIC.preload = 'auto';

        let musicStarted = false;
        function tryStartMusic() {
            if (!musicStarted) {
                BG_MUSIC.play().then(() => {
                    musicStarted = true;
                }).catch(e => {});
            }
        }

        tryStartMusic();

        const enableAudioEvents = ['click', 'touchstart', 'keydown', 'pointerdown'];
        enableAudioEvents.forEach(eventType => {
            window.addEventListener(eventType, tryStartMusic, { once: true });
        });

        function handleGameStart(e) {
            if (isGameOver) {
                resetGameToLevel0();
                return;
            }

            if (e && typeof e.preventDefault === 'function') {
                e.preventDefault();
            }
            tryStartMusic();
            if (!gameStarted) {
                gameStarted = true;
                if (startScreen) {
                    startScreen.style.display = 'none'; 
                }
                loadLevel(1, 'start');
            }
        }

        function resetGameToLevel0() {
            if (gameOverTimeout) clearTimeout(gameOverTimeout);
            if (objectiveTimeout) clearTimeout(objectiveTimeout);
            if (levelObjectiveMsg) levelObjectiveMsg.classList.remove('visible');

            isGameOver = false;
            gameStarted = false;
            isDead = false;
            deathAnimationStarted = false;

            gameOverScreen.classList.remove('visible');
            
            currentLives = maxLives;
            currentHealth = maxHealth;
            killedZombies = 0;
            currentLevel = 1;
            playerWorldX = 100;
            playerY = 0;
            jumpVelocity = 0;
            isJumping = false;
            isMoving = false;
            isPunching = false;
            keysPressed = {};

            barricadeActive = true;
            barricadeElement.style.display = 'block';

            updateLivesUI();
            healthBar.style.width = '100%';
            killCountElement.innerText = '0';
            levelIndicator.innerText = "Nivel 1";
            playerShadow.style.display = 'block';
            setPlayerSprite(IDLE_SRC, '40.8vh');

            clearZombies();
            clearRats();

            startScreen.style.display = 'flex';
        }

        window.addEventListener('keydown', (e) => {
            if (isGameOver) {
                resetGameToLevel0();
                return;
            }
            if (!gameStarted) {
                handleGameStart(e);
                return;
            }
            tryStartMusic();
            keysPressed[e.key.toLowerCase()] = true;
        });

        window.addEventListener('keyup', (e) => {
            keysPressed[e.key.toLowerCase()] = false;
        });

        function bindTouch(elementId, keyName) {
            const btn = document.getElementById(elementId);
            if (!btn) return;
            
            const press = (e) => {
                e.preventDefault();
                if (isGameOver) {
                    resetGameToLevel0();
                    return;
                }
                if (!gameStarted) {
                    handleGameStart(e);
                    return;
                }
                tryStartMusic();
                keysPressed[keyName] = true;
            };

            const release = (e) => {
                e.preventDefault();
                keysPressed[keyName] = false;
            };

            btn.addEventListener('touchstart', press, { passive: false });
            btn.addEventListener('touchend', release, { passive: false });
            btn.addEventListener('touchcancel', release, { passive: false });
        }

        bindTouch('btn-left', 'a');
        bindTouch('btn-right', 'd');
        bindTouch('btn-jump', 'w');

        const punchBtn = document.getElementById('btn-punch');
        if (punchBtn) {
            const handlePunch = (e) => {
                e.preventDefault();
                if (isGameOver) {
                    resetGameToLevel0();
                    return;
                }
                if (!gameStarted) {
                    handleGameStart(e);
                    return;
                }
                tryStartMusic();
                performPunch();
            };
            punchBtn.addEventListener('touchstart', handlePunch, { passive: false });
        }

        if (startScreen) {
            startScreen.addEventListener('click', (e) => handleGameStart(e));
            startScreen.addEventListener('touchstart', (e) => handleGameStart(e), { passive: false });
        }

        if (gameOverScreen) {
            gameOverScreen.addEventListener('click', () => resetGameToLevel0());
            gameOverScreen.addEventListener('touchstart', (e) => {
                e.preventDefault();
                resetGameToLevel0();
            }, { passive: false });
        }

        window.addEventListener('mousedown', (e) => {
            if (isGameOver) {
                resetGameToLevel0();
                return;
            }
            if (!gameStarted) {
                handleGameStart(e);
                return;
            }
            if (e.button === 0) {
                tryStartMusic();
                performPunch();
            }
        });

        const PUNCH_AUDIO = new Audio('./faaa.mp3');
        PUNCH_AUDIO.volume = 0.2268; 

        function performPunch() {
            if (!gameStarted || isPunching || isDead || isGameOver) return;
            isPunching = true;
            PUNCH_AUDIO.currentTime = 0;
            PUNCH_AUDIO.play().catch(e => {});
            setPlayerSprite(PUNCH_SRC, '42vh');

            setTimeout(() => { checkPunchHit(); }, 200);

            setTimeout(() => {
                isPunching = false;
                if (isDead) return;
                
                if (isJumping) {
                    setPlayerSprite(JUMP_SRC, '40vh');
                } else {
                    let isMovingNow = keysPressed['a'] || keysPressed['d'];
                    if (isMovingNow) {
                        setPlayerSprite(WALK_SRC, '40vh');
                        isMoving = true;
                    } else {
                        setPlayerSprite(IDLE_SRC, '40.8vh');
                        isMoving = false;
                    }
                }
            }, 500);
        }

        function triggerPlayerDeath() {
            if (isDead || isGameOver) return;
            isDead = true;
            deathAnimationStarted = false;

            clearZombies();
            clearRats();

            playerShadow.style.display = 'none';

            if (playerY <= 0) {
                startDeathSequence();
            }
        }

        function startDeathSequence() {
            if (deathAnimationStarted) return;
            deathAnimationStarted = true;

            playerImg.src = DEATH_SRC + '?t=' + Date.now();
            playerImg.style.height = '40.8vh';

            currentLives--;
            updateLivesUI();

            setTimeout(() => {
                if (currentLives > 0) {
                    respawnPlayer();
                } else {
                    triggerGameOver();
                }
            }, DEATH_ANIMATION_DURATION + 200);
        }

        function respawnPlayer() {
            currentHealth = maxHealth;
            healthBar.style.width = '100%';
            isDead = false;
            deathAnimationStarted = false;
            playerShadow.style.display = 'block';
            
            playerWorldX = 100;
            playerY = 0;
            isJumping = false;
            jumpVelocity = 0;

            setPlayerSprite(IDLE_SRC, '40.8vh');
            isMoving = false;

            startZombieSpawning();
            startRatSpawning();
        }

        function triggerGameOver() {
            isGameOver = true;
            isMoving = false;
            if (levelObjectiveMsg) levelObjectiveMsg.classList.remove('visible');
            
            gameOverScreen.classList.add('visible');

            gameOverTimeout = setTimeout(() => {
                if (isGameOver) {
                    resetGameToLevel0();
                }
            }, 10000);
        }

        function createSmokeEffect(worldX, isPlayerFacingRight) {
            const smokeImg = document.createElement('img');
            const smokeFacingRight = !isPlayerFacingRight;
            smokeImg.className = `smoke-effect ${smokeFacingRight ? 'facing-right' : 'facing-left'}`;
            
            let initialScreenX = worldX - targetCamerax;
            smokeImg.style.left = `${initialScreenX}px`;
            smokeImg.style.bottom = `${getFloorHeightPx()}px`;

            smokeImg.src = SMOKE_SRC + '?t=' + Date.now();
            container.appendChild(smokeImg);

            const smokeObj = { element: smokeImg, worldX: worldX };
            smokeEffects.push(smokeObj);

            setTimeout(() => {
                if (smokeImg.parentNode) smokeImg.parentNode.removeChild(smokeImg);
                smokeEffects = smokeEffects.filter(s => s !== smokeObj);
            }, 700);
        }

        function checkPunchHit() {
            const hitRange = screenHeight * 0.25; 
            const isFacingRight = player.classList.contains('facing-right');

            let closestZombieIndex = -1;
            let closestZombieDist = Infinity;
            for (let i = 0; i < zombies.length; i++) {
                const zombie = zombies[i];
                const inRange = isFacingRight
                    ? (zombie.worldX >= playerWorldX && zombie.worldX <= playerWorldX + hitRange)
                    : (zombie.worldX <= playerWorldX && zombie.worldX >= playerWorldX - hitRange);

                if (inRange) {
                    const dist = Math.abs(zombie.worldX - playerWorldX);
                    if (dist < closestZombieDist) {
                        closestZombieDist = dist;
                        closestZombieIndex = i;
                    }
                }
            }

            if (closestZombieIndex !== -1) {
                const zombie = zombies[closestZombieIndex];
                const zombieCenterX = zombie.worldX + (getPlayerWidth() / 2);
                createSmokeEffect(zombieCenterX, isFacingRight);

                if (zombie.element && zombie.element.parentNode) {
                    zombie.element.parentNode.removeChild(zombie.element);
                }
                zombies.splice(closestZombieIndex, 1);

                killedZombies++;
                killCountElement.innerText = killedZombies;
            }
        }

        function spawnZombie() {
            if (!gameStarted || isChangingLevel || isDead || isGameOver) return;

            const pWidth = getPlayerWidth();
            const spawnFromLeft = Math.random() < 0.5;
            let spawnX = spawnFromLeft 
                ? Math.max(0, targetCamerax - 120)
                : Math.min(backgroundWorldWidth - pWidth, targetCamerax + screenWidth + 20);

            const zombieAudio = new Audio('./zombi_audio.mp3');
            zombieAudio.volume = 0.6;
            zombieAudio.play().catch(() => {
                zombieAudio.src = './zombi_audio.wav';
                zombieAudio.play().catch(() => {});
            });

            const zombieDiv = document.createElement('div');
            zombieDiv.className = 'zombie-container facing-right';

            const shadowImg = document.createElement('img');
            shadowImg.className = 'zombie-shadow';
            shadowImg.src = SHADOW_SRC;

            const zombieImg = document.createElement('img');
            zombieImg.className = 'zombie-img';
            
            const randomOffset = (Math.random() * 5).toFixed(2);
            zombieImg.src = `${ZOMBIE_SRC}#t=${randomOffset}`;

            zombieDiv.appendChild(shadowImg);
            zombieDiv.appendChild(zombieImg);
            container.appendChild(zombieDiv);

            zombies.push({
                element: zombieDiv,
                imageElement: zombieImg,
                worldX: spawnX,
                speedRatio: 0.12 + Math.random() * 0.06,
                isGrabbing: false,
                lastAttackTime: 0
            });
        }

        function clearZombies() {
            if (zombieSpawnTimeout) {
                clearTimeout(zombieSpawnTimeout);
                zombieSpawnTimeout = null;
            }
            if (zombieSpawnInterval) {
                clearInterval(zombieSpawnInterval);
                zombieSpawnInterval = null;
            }

            zombies.forEach(zombie => {
                if (zombie.element && zombie.element.parentNode) zombie.element.parentNode.removeChild(zombie.element);
            });
            zombies = [];

            smokeEffects.forEach(smoke => {
                if (smoke.element && smoke.element.parentNode) smoke.element.parentNode.removeChild(smoke.element);
            });
            smokeEffects = [];
        }

        function startZombieSpawning() {
            if (!gameStarted || isGameOver) return;
            clearZombies();
            zombieSpawnTimeout = setTimeout(() => {
                spawnZombie(); 
                zombieSpawnInterval = setInterval(spawnZombie, ZOMBIE_SPAWN_RATE);
            }, ZOMBIE_INITIAL_DELAY);
        }

        function spawnRat() {
            if (!gameStarted || isChangingLevel || isDead || isGameOver) return;

            let spawnX = targetCamerax + screenWidth + 50;

            const ratDiv = document.createElement('div');
            ratDiv.className = 'rat-container facing-left';

            const shadowImg = document.createElement('img');
            shadowImg.className = 'rat-shadow';
            shadowImg.src = SHADOW_SRC;

            const ratImg = document.createElement('img');
            ratImg.className = 'rat-img';
            
            const randomOffset = (Math.random() * 5).toFixed(2);
            ratImg.src = `${RAT_SRC}#t=${randomOffset}`;

            ratDiv.appendChild(shadowImg);
            ratDiv.appendChild(ratImg);
            container.appendChild(ratDiv);

            rats.push({
                element: ratDiv,
                worldX: spawnX,
                speedRatio: 0.21,
                lastAttackTime: 0
            });
        }

        function clearRats() {
            if (ratSpawnInterval) {
                clearInterval(ratSpawnInterval);
                ratSpawnInterval = null;
            }

            rats.forEach(rat => {
                if (rat.element && rat.element.parentNode) {
                    rat.element.parentNode.removeChild(rat.element);
                }
            });
            rats = [];
        }

        function startRatSpawning() {
            if (!gameStarted || isGameOver) return;
            clearRats();
            ratSpawnInterval = setInterval(spawnRat, RAT_SPAWN_RATE);
        }

        function loadLevel(levelNum, spawnAt = 'start') {
            if (!LEVEL_BACKGROUNDS[levelNum] || isGameOver) return;

            isChangingLevel = true;
            currentLevel = levelNum;
            levelIndicator.innerText = `Nivel ${currentLevel}`;
            clearZombies();
            clearRats();

            barricadeActive = (levelNum === 1);
            barricadeElement.style.display = barricadeActive ? 'block' : 'none';

            if (levelNum === 1) {
                showObjectiveMessage();
            } else if (levelObjectiveMsg) {
                levelObjectiveMsg.classList.remove('visible');
            }

            const bgPath = encodeURI(LEVEL_BACKGROUNDS[levelNum]);
            const fgPath = LEVEL_FOREGROUNDS[levelNum] ? encodeURI(LEVEL_FOREGROUNDS[levelNum]) : null;

            let bgLoaded = false;
            let fgLoaded = !fgPath;

            const checkAndFinish = () => {
                if (bgLoaded && fgLoaded) {
                    background.style.backgroundImage = `url('${bgPath}')`;
                    background.style.width = `${backgroundWorldWidth}px`;

                    if (fgPath) {
                        foreground.style.display = 'block';
                        foreground.style.backgroundImage = `url('${fgPath}')`;
                        foreground.style.width = `${foregroundWorldWidth}px`;
                    } else {
                        foreground.style.display = 'none';
                    }

                    const pWidth = getPlayerWidth();
                    playerWorldX = (spawnAt === 'start') ? 100 : backgroundWorldWidth - pWidth - 100;

                    let isMovingNow = keysPressed['a'] || keysPressed['d'];
                    if (!isDead) {
                        if (isMovingNow) {
                            setPlayerSprite(WALK_SRC, '40vh');
                            isMoving = true;
                        } else {
                            setPlayerSprite(IDLE_SRC, '40.8vh');
                            isMoving = false;
                        }
                    }

                    isChangingLevel = false;
                    startZombieSpawning();
                    startRatSpawning();
                }
            };

            const bgImg = new Image();
            bgImg.onload = function() {
                backgroundWorldWidth = screenHeight * (this.width / this.height);
                bgLoaded = true;
                checkAndFinish();
            };
            bgImg.onerror = function() {
                bgLoaded = true;
                checkAndFinish();
            };
            bgImg.src = bgPath;

            if (fgPath) {
                const fgImg = new Image();
                fgImg.onload = function() {
                    foregroundWorldWidth = screenHeight * (this.width / this.height);
                    fgLoaded = true;
                    checkAndFinish();
                };
                fgImg.onerror = function() {
                    fgLoaded = true;
                    checkAndFinish();
                };
                fgImg.src = fgPath;
            }
        }

        let lastFrameTime = null;

        function gameLoop(timestamp) {
            if (lastFrameTime === null) lastFrameTime = timestamp;
            let dt = (timestamp - lastFrameTime) / 1000;
            lastFrameTime = timestamp;
            dt = Math.min(dt, 0.05);

            let horizontallyMovingThisFrame = false;
            const currentSpeed = getPlayerSpeed() * (isJumping ? 1.2155 : 1);
            const pWidth = getPlayerWidth();

            if (gameStarted && !isChangingLevel && !isDead && !isGameOver) {
                // --- LÓGICA DE LA BARRICADA DINÁMICA ---
                if (currentLevel === 1 && barricadeActive) {
                    barricadeElement.style.display = 'block';
                    
                    let barricadeWorldX = backgroundWorldWidth - pWidth - 300;
                    let barricadeScreenX = barricadeWorldX - targetCamerax;
                    
                    barricadeElement.style.left = `${barricadeScreenX}px`;

                    if (playerWorldX + pWidth > barricadeWorldX) {
                        playerWorldX = barricadeWorldX - pWidth;
                    }

                    if (killedZombies >= KILLS_REQUIRED) {
                        barricadeActive = false;
                        barricadeElement.style.display = 'none';
                    }
                } else {
                    barricadeElement.style.display = 'none';
                }

                if (!isPunching) {
                    if (keysPressed['a']) {
                        playerWorldX -= currentSpeed * dt;
                        player.classList.remove('facing-right');
                        player.classList.add('facing-left');
                        horizontallyMovingThisFrame = true;
                    }
                    if (keysPressed['d']) {
                        playerWorldX += currentSpeed * dt;
                        player.classList.remove('facing-left');
                        player.classList.add('facing-right');
                        horizontallyMovingThisFrame = true;
                    }

                    if ((keysPressed['w'] || keysPressed[' '] || keysPressed['arrowup']) && !isJumping) {
                        isJumping = true;
                        jumpVelocity = JUMP_FORCE;
                        setPlayerSprite(JUMP_SRC, '40vh');
                    }
                }

                const maxX = backgroundWorldWidth - pWidth;

                if (playerWorldX >= maxX) {
                    playerWorldX = maxX;
                    if (currentLevel === 1) loadLevel(2, 'start'); 
                    else if (currentLevel === 2) loadLevel(3, 'start'); 
                }

                if (playerWorldX <= 0) {
                    if (currentLevel === 2) loadLevel(1, 'end'); 
                    else if (currentLevel === 3) loadLevel(2, 'end'); 
                    else playerWorldX = 0; 
                }
            }

            updateGoLogic(horizontallyMovingThisFrame, isJumping, dt);

            if (gameStarted && (isJumping || (isDead && playerY > 0))) {
                playerY += jumpVelocity * dt;
                jumpVelocity -= GRAVITY * dt;

                if (playerY <= 0) {
                    playerY = 0;
                    jumpVelocity = 0;
                    isJumping = false;

                    if (isDead) {
                        startDeathSequence();
                    } else if (!isPunching && !isGameOver) {
                        let isMovingNow = keysPressed['a'] || keysPressed['d'];
                        if (isMovingNow) {
                            setPlayerSprite(WALK_SRC, '40vh');
                            isMoving = true;
                        } else {
                            setPlayerSprite(IDLE_SRC, '40.8vh');
                            isMoving = false;
                        }
                    }
                }
            }

            if (!isPunching && !isDead && !isJumping && !isGameOver) {
                if (horizontallyMovingThisFrame && !isMoving) {
                    setPlayerSprite(WALK_SRC, '40vh');
                    isMoving = true;
                } else if (!horizontallyMovingThisFrame && isMoving) {
                    setPlayerSprite(IDLE_SRC, '40.8vh');
                    isMoving = false;
                }
            } else if (!isJumping) {
                isMoving = horizontallyMovingThisFrame;
            }

            targetCamerax = playerWorldX - (screenWidth / 2) + (pWidth / 2);
            targetCamerax = Math.max(0, Math.min(targetCamerax, backgroundWorldWidth - screenWidth));

            background.style.transform = `translateX(-${targetCamerax}px)`;
            
            if (LEVEL_FOREGROUNDS[currentLevel]) {
                let parallaxFactor = PARALLAX_FACTORS[currentLevel] ?? 1.0;
                foreground.style.transform = `translateX(-${targetCamerax * parallaxFactor}px)`;
            }

            let currentFloorHeight = getFloorHeightPx();
            let playerScreenX = playerWorldX - targetCamerax;
            player.style.left = `${playerScreenX}px`;
            player.style.bottom = `${currentFloorHeight + playerY}px`;

            if (isJumping || isDead || isGameOver) {
                playerShadow.style.display = 'none';
            } else {
                playerShadow.style.display = 'block';
                let shadowRatio = Math.min(1, playerY / (screenHeight * 0.25));
                playerShadow.style.transform = `translateX(-50%) scale(${1 - (shadowRatio * 0.45)})`;
                playerShadow.style.opacity = 0.8 - (shadowRatio * 0.55);
            }

            if (gameStarted && !isChangingLevel && !isDead && !isGameOver) {
                const stopDistance = screenHeight * 0.16; 
                const damageDistance = screenHeight * 0.18; 
                const ratDamageDistance = screenHeight * 0.12;
                const now = Date.now();

                zombies.forEach(zombie => {
                    let distance = Math.abs(zombie.worldX - playerWorldX);
                    let zombieSpeed = screenHeight * zombie.speedRatio * dt;

                    if (distance > stopDistance) {
                        if (zombie.worldX < playerWorldX) {
                            zombie.worldX += zombieSpeed;
                            zombie.element.className = 'zombie-container facing-right';
                        } else {
                            zombie.worldX -= zombieSpeed;
                            zombie.element.className = 'zombie-container facing-left';
                        }

                        if (zombie.isGrabbing) {
                            zombie.isGrabbing = false;
                            const randomOffset = (Math.random() * 5).toFixed(2);
                            zombie.imageElement.src = `${ZOMBIE_SRC}#t=${randomOffset}`;
                        }
                    } else {
                        zombie.element.className = zombie.worldX < playerWorldX ? 'zombie-container facing-right' : 'zombie-container facing-left';

                        if (!zombie.isGrabbing) {
                            zombie.isGrabbing = true;
                            const randomOffset = (Math.random() * 5).toFixed(2);
                            zombie.imageElement.src = `${ZOMBIE_GRAB_SRC}#t=${randomOffset}`;
                        }

                        if (distance <= damageDistance && (now - zombie.lastAttackTime >= 1000)) {
                            zombie.lastAttackTime = now;
                            currentHealth = Math.max(0, currentHealth - 8);
                            healthBar.style.width = `${(currentHealth / maxHealth) * 100}%`;

                            if (currentHealth <= 0) triggerPlayerDeath();
                        }
                    }

                    zombie.element.style.left = `${zombie.worldX - targetCamerax}px`;
                    zombie.element.style.bottom = `${currentFloorHeight}px`;
                });

                for (let i = rats.length - 1; i >= 0; i--) {
                    let rat = rats[i];
                    let ratSpeed = screenHeight * rat.speedRatio * dt;

                    rat.worldX -= ratSpeed;

                    let distance = Math.abs(rat.worldX - playerWorldX);
                    if (distance <= ratDamageDistance && playerY < screenHeight * 0.1) {
                        if (now - rat.lastAttackTime >= 800) {
                            rat.lastAttackTime = now;
                            currentHealth = Math.max(0, currentHealth - 10);
                            healthBar.style.width = `${(currentHealth / maxHealth) * 100}%`;

                            if (currentHealth <= 0) triggerPlayerDeath();
                        }
                    }

                    rat.element.style.left = `${rat.worldX - targetCamerax}px`;
                    rat.element.style.bottom = `${currentFloorHeight}px`;

                    if (rat.worldX < targetCamerax - 100) {
                        if (rat.element && rat.element.parentNode) {
                            rat.element.parentNode.removeChild(rat.element);
                        }
                        rats.splice(i, 1);
                    }
                }

                smokeEffects.forEach(smoke => {
                    smoke.element.style.left = `${smoke.worldX - targetCamerax}px`;
                    smoke.element.style.bottom = `${currentFloorHeight}px`;
                });
            }

            requestAnimationFrame(gameLoop);
        }

        updateLivesUI();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
